name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_PARALLEL_LEVEL: 2

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug (Qt 6.8 minimum)
            preset: dev
            qt_version: '6.8.3'
            config_parser: 'ON'
          - name: GCC Release (Qt 6.8 minimum)
            preset: release
            qt_version: '6.8.3'
            config_parser: 'ON'
          - name: Clang ASan + UBSan (Qt 6.8 minimum)
            preset: sanitize
            qt_version: '6.8.3'
            config_parser: 'ON'
          - name: GCC Debug (current Qt)
            preset: dev
            qt_version: '6.11.1'
            config_parser: 'ON'
          - name: GCC Debug, config parser disabled (Qt 6.8 minimum)
            preset: dev
            qt_version: '6.8.3'
            config_parser: 'OFF'

    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            clang-format \
            cmake \
            curl \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ncurses-bin \
            ninja-build \
            wayland-protocols \
            weston \
            xz-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qtwaylandcompositor
          cache: true

      - name: Install LayerShellQt
        run: |
          layershellqt_prefix="$RUNNER_TEMP/layershellqt"
          ./scripts/bootstrap-layershellqt.sh "$layershellqt_prefix"
          echo "CMAKE_PREFIX_PATH=$layershellqt_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$layershellqt_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=$layershellqt_prefix/lib/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}" >> "$GITHUB_ENV"

      - name: Install verified Zig toolchain
        run: ./scripts/bootstrap-zig.sh

      - name: Verify pinned inputs
        run: |
          test "$(./.local/bin/zig version)" = "0.16.0"
          test "$(git -C ghostty rev-parse HEAD)" = "$(cat GHOSTTY_REVISION)"
          test "$(qmake -query QT_VERSION)" = "${{ matrix.qt_version }}"
          test -f "$RUNNER_TEMP/layershellqt/lib/cmake/LayerShellQt/LayerShellQtConfig.cmake"
          clang-format --version
          cmake --version

      - name: Configure
        run: >-
          cmake --preset "${{ matrix.preset }}"
          -DGHOSTTY_QT_ENABLE_GHOSTTY_CONFIG=${{ matrix.config_parser }}

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" -j"$(nproc)"

      - name: Test
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          export WAYLAND_DISPLAY=wayland-ci
          export GHOSTTY_QT_REQUIRE_WAYLAND_RHI=1
          export LIBGL_ALWAYS_SOFTWARE=1
          install -d -m 700 "$XDG_RUNTIME_DIR"
          weston \
            --backend=headless-backend.so \
            --renderer=gl \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$weston_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          ctest --preset "${{ matrix.preset }}"
